
# ==========================================
# DEPENDABOT - GESTOCK
# Bodega Jefrycito
# ==========================================
# Actualización automática de dependencias
# y herramientas de GitHub Actions.
# ==========================================

version: 2

updates:

  # ========================================
  # 1. DEPENDENCIAS DEL PROYECTO
  # ========================================
  - package-ecosystem: "npm"
    directory: "/"

    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Lima"

    open-pull-requests-limit: 5

    labels:
      - "dependencias"

  # ========================================
  # 2. GITHUB ACTIONS
  # ========================================
  - package-ecosystem: "github-actions"
    directory: "/"

    schedule:
      interval: "weekly"

    labels:
      - "ci/cd"
