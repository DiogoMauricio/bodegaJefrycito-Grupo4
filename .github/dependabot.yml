# Configuración de GitHub Dependabot para Gestock
# Monitoreo automático de vulnerabilidades y actualización de dependencias

version: 2
updates:
  # Escaneo de dependencias de Node.js (package.json)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Lima"
    open-pull-requests-limit: 5
    labels:
      - "dependencias"
      - "seguridad"

  # Escaneo de versiones de GitHub Actions (.github/workflows)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "ci/cd"
      - "seguridad"

