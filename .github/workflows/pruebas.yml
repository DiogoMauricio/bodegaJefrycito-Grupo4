
name: Ejecutar pruebas automatizadas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar TypeScript
        run: npm run typecheck

      - name: Compilar proyecto
        run: npm run build

      - name: Ejecutar pruebas
        run: npm test

      - name: Auditoría de vulnerabilidades de seguridad (npm audit)
        run: |
          echo "=== Escaneo de seguridad de dependencias (SCA) ==="
          npm audit || true
